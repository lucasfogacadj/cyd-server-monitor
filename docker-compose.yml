name: cyd-server-monitor

services:
  tft-dashboard-api:
    build: .
    image: cyd-server-monitor:local
    container_name: tft-dashboard-api
    environment:
      PROM_URL: ${PROM_URL:-http://prometheus:9090}
      LISTEN_PORT: "9881"
      # Cache maior que o intervalo de poll da telinha: varias telinhas (ou um
      # reconnect em loop) nao viram 12 queries no Prometheus a cada refresh.
      CACHE_TTL: ${CACHE_TTL:-10}
      SCRAPE_TIMEOUT: ${SCRAPE_TIMEOUT:-8}
      DISK_MOUNTS: ${DISK_MOUNTS:-/,/mnt/backup}
      TEMP_CHIP: ${TEMP_CHIP:-platform_coretemp_0}
      SOLAR_POWER_QUERY: ${SOLAR_POWER_QUERY:-}
      SOLAR_TODAY_QUERY: ${SOLAR_TODAY_QUERY:-}
      SOLAR_TOTAL_QUERY: ${SOLAR_TOTAL_QUERY:-}
      SOLAR_MONTH_QUERY: ${SOLAR_MONTH_QUERY:-}
      SOLAR_YEAR_QUERY: ${SOLAR_YEAR_QUERY:-}
      SOLAR_DAYLIGHT_QUERY: ${SOLAR_DAYLIGHT_QUERY:-}
      SOLAR_LIVE_QUERY: ${SOLAR_LIVE_QUERY:-}
      SOLAR_GRID_QUERY: ${SOLAR_GRID_QUERY:-}
      SOLAR_LOAD_QUERY: ${SOLAR_LOAD_QUERY:-}
      SOLAR_POWER_SCALE: ${SOLAR_POWER_SCALE:-1}
      SOLAR_ENERGY_SCALE: ${SOLAR_ENERGY_SCALE:-1}
    ports:
      - "${TFT_API_PORT:-9881}:9881"
    restart: unless-stopped
    networks:
      - monitor

networks:
  monitor:
    # Rede da stack do Grafana, onde vive o prometheus. Externa de proposito:
    # este compose nao deve criar nem destruir a rede.
    name: ${DOCKER_NETWORK:-grafana_default}
    external: true
