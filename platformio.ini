; ESP32-2432S028R "Cheap Yellow Display" -- monitor de saude do servidor.
;
; O TFT_eSPI e configurado INTEIRAMENTE por build_flags aqui. Nao edite
; User_Setup.h dentro de .pio/libdeps -- aquilo e apagado a cada reinstalacao
; da lib. USER_SETUP_LOADED=1 faz a lib ignorar os headers dela e usar so isto.

[env:cyd]
platform  = espressif32@^6.5.0
board     = esp32dev
framework = arduino

monitor_speed   = 115200
upload_speed    = 921600
monitor_filters = esp32_exception_decoder, time

; TFT_eSPI + WiFiManager + ArduinoJson enchem 83% da particao "default"
; (1.31MB). huge_app da 3MB para a app -- sem OTA, que nao usamos porque a
; gravacao e sempre por USB.
board_build.partitions = huge_app.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.0.4
    https://github.com/tzapu/WiFiManager.git#v2.0.17

build_flags =
    ; ---- ajustes do projeto -------------------------------------------------
    -DPOLL_INTERVAL_MS=5000
    ; Ligado de novo para validar cor de verdade: o fundo estava saindo branco
    ; com TFT_INVERSION_ON. Desligue (0) so depois de confirmar na tela.
    -DSHOW_BOOT_SELFTEST=1

    ; ---- TFT_eSPI: painel do CYD -------------------------------------------
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    ; O painel do CYD e ligado no HSPI, nao no VSPI padrao.
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    ; ATENCAO: este painel NAO quer inversao. Com TFT_INVERSION_ON o fundo
    ; #05070D saia branco e todas as cores vinham complementadas (ciano virava
    ; laranja). Confirmado na tela em 2026-09-11.
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_OFF=1

    ; ---- fontes -------------------------------------------------------------
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DSMOOTH_FONT=1

    ; 55MHz e o teto estavel do CYD; 80MHz produz pixels sujos em algumas
    ; unidades por causa do comprimento das trilhas.
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
